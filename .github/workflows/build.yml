name: Build plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Jave 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Wrzuć jar jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: OnlineOsoby
          path: target/*.jar
